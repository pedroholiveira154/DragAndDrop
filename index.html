<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop — Jogo de Combinação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="cabecalho">
        <h1>Drag and Drop</h1>
        <p class="contador" id="contadorDescobertos">4 elementos descobertos</p>
    </header>

    <main class="jogo">
        <section class="areaCombinacao" aria-label="Área de combinação">
            <div id="encaixe1" class="encaixe" ondrop="soltar(event)" ondragover="permitirSoltar(event)"></div>
            <p class="operador">+</p>
            <div id="encaixe2" class="encaixe" ondrop="soltar(event)" ondragover="permitirSoltar(event)"></div>
            <p id="sinalIgual" class="operador" hidden>=</p>
            <div id="encaixeResultado" class="encaixe resultado" hidden></div>
        </section>

        <section class="areaElementos" id="areaElementos" aria-label="Elementos descobertos"></section>
    </main>

    <p id="aviso" class="aviso" hidden></p>

    <script src="data.js"></script>
    <script src="global.js"></script>
    <script src="script.js"></script>
</body>

</html>
